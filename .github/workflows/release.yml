# Builds Act Browser for macOS, Windows and Linux, starts each build to check
# it works, and on a version tag publishes a GitHub release with everything:
#
#   macOS    .dmg (drag to Applications)        + .zip/.sig for updates
#   Windows  -setup.exe (installer)             + .zip/.sig for updates
#   Linux    .deb, .tar.xz                      + .tar.xz.sig for updates
#
# The downloads have the same name in every release, so these links always
# get the newest version (for the website):
#
#   https://github.com/alfredmurray-goat/act-browser/releases/latest/download/Act-Browser-mac.dmg
#   https://github.com/alfredmurray-goat/act-browser/releases/latest/download/Act-Browser-win64-setup.exe
#   https://github.com/alfredmurray-goat/act-browser/releases/latest/download/act-browser_amd64.deb
#   https://github.com/alfredmurray-goat/act-browser/releases/latest/download/Act-Browser-linux-x86_64.tar.xz
#
# To release:
#
#   npm version 0.4.0 --no-git-tag-version
#   git commit -am "Act Browser 0.4.0" && git tag v0.4.0 && git push && git push --tags
#
# Installed copies find the release, check its signature and update
# themselves. Signing needs the ACT_UPDATE_KEY secret (see scripts/keygen.mjs).

name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"

      - name: Install dmgbuild
        if: runner.os == 'macOS'
        run: python3 -m pip install dmgbuild

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Build and package
        env:
          ACT_UPDATE_KEY: ${{ secrets.ACT_UPDATE_KEY }}
        run: |
          if [ -z "$ACT_UPDATE_KEY" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ACT_UPDATE_KEY isn't set, installed browsers would refuse this update."
            exit 1
          fi
          npm run package

      - name: Start it and check it works
        run: npm run smoke

      - uses: actions/upload-artifact@v4
        with:
          name: act-browser-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sig
            dist/*.tar.xz
            dist/*.deb
            dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Act Browser ${GITHUB_REF_NAME#v}" \
            --generate-notes

      # Act Browser isn't notarized, so the .dmg is quarantined on download and
      # macOS refuses to open it. Say so at the top of the release, next to the
      # download buttons, with the two ways around it.
      - name: Add the macOS first-run note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > note.md <<'EOF'
          ## macOS: install it without the Gatekeeper block

          Act Browser isn't notarized by Apple yet, so a copy downloaded in a
          browser carries the quarantine flag and macOS refuses to open it
          ("cannot be verified" or "is damaged"). Fetch it with curl instead:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/alfredmurray-goat/act-browser/main/scripts/install-macos.sh | bash
          ```

          That installs or updates `/Applications/Act Browser.app` and opens it.
          Homebrew works too:

          ```bash
          brew tap alfredmurray-goat/act-browser https://github.com/alfredmurray-goat/act-browser
          brew install --cask act-browser
          ```

          Already downloaded the `.dmg`? Run the curl line above (it repairs the
          copy you installed), or open the app once with right-click › Open.

          ---

          EOF
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          cp note.md release-notes.md
          printf '%s\n' "$body" >> release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
