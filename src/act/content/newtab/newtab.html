<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; frame-src https://rejn.app https://www.rejn.app; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>New Tab</title>
  <link rel="icon" href="../icons/logo-64.png">
  <link rel="stylesheet" href="../shared/act.css">
  <link rel="stylesheet" href="newtab.css">
  <script type="module" src="newtab.mjs"></script>
</head>
<body>
  <!-- Top right, where Firefox's own new tab puts its weather. -->
  <aside id="weather" hidden></aside>

  <main>
    <div id="hero">
      <img class="logo" src="../icons/logo-192.png" alt="">
      <div>
        <h1 id="greeting"></h1>
        <p id="weather-line" hidden></p>
      </div>
    </div>

    <form id="search" role="search">
      <div id="searchbox">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M7 1.75a5.25 5.25 0 0 1 4.16 8.46l3.07 3.07a.75.75 0 1 1-1.06 1.06l-3.07-3.07A5.25 5.25 0 1 1 7 1.75zm0 1.5a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5z"/>
        </svg>
        <input id="query" type="search" autocomplete="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="suggest" aria-label="Search">
      </div>
      <ul id="suggest" role="listbox" hidden></ul>
    </form>

    <div id="below">
      <nav id="top-sites" aria-label="Top sites"></nav>
    </div>
  </main>
</body>
</html>
