<!DOCTYPE html>

   - file, You can obtain one at http://mozilla.org/MPL/2.0/. -->
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; frame-src https://rejn.app https://www.rejn.app; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>New Tab</title>
  <link rel="icon" href="../icons/logo-64.png">
  <link rel="stylesheet" href="../shared/act.css">
  <link rel="stylesheet" href="newtab.css">
  <script type="module" src="newtab.mjs"></script>
</head>
<body>
  <!-- Top right, where Firefox's own new tab puts its weather. In the page
       flow rather than on top of it, so it can't cover the greeting. -->
  <header id="topbar">
    <aside id="weather" hidden></aside>
  </header>

  <main>
    <div id="hero">
      <img class="logo" src="../icons/logo-192.png" alt="">
      <div>
        <h1 id="greeting"></h1>
      </div>
    </div>

    <form id="search" role="search">
      <div id="searchbox">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M7 1.75a5.25 5.25 0 0 1 4.16 8.46l3.07 3.07a.75.75 0 1 1-1.06 1.06l-3.07-3.07A5.25 5.25 0 1 1 7 1.75zm0 1.5a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5z"/>
        </svg>
        <input id="query" type="search" autocomplete="off" spellcheck="false"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="suggest" aria-label="Search">
      </div>
      <ul id="suggest" role="listbox" hidden></ul>
    </form>

    <div id="below">
      <div id="widgets" class="widget-grid"></div>
      <h2 id="saved-heading">Your sites</h2>
      <nav id="saved-sites" class="site-grid" aria-label="Saved sites"></nav>
      <form id="add-site" hidden>
        <input id="add-site-url" type="text" placeholder="Address, e.g. github.com" autocomplete="off" spellcheck="false" required>
        <input id="add-site-name" type="text" placeholder="Name (optional)" autocomplete="off">
        <button type="submit">Save</button>
        <button type="button" id="add-site-cancel">Cancel</button>
      </form>
      <h2 id="top-sites-heading" hidden>Frequently visited</h2>
      <nav id="top-sites" class="site-grid" aria-label="Frequently visited"></nav>
    </div>
  </main>

  <!-- Bottom left: pick a wallpaper. -->
  <div id="customize">
    <button id="customize-button" type="button" aria-haspopup="dialog"
            aria-expanded="false" title="Change wallpaper">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M13.9 1.1a1.6 1.6 0 0 1 0 2.3L8.6 8.7 7.3 7.4l5.3-5.3a1.6 1.6 0 0 1 1.3-1zM6.4 8.3l1.3 1.3-.4.4a2.2 2.2 0 0 1-1.5.7c0 1.9-1.6 3.3-3.6 3.3H1l.6-.9c.4-.6.5-1.1.5-1.8 0-1.5 1.2-2.7 2.7-2.7.4-.3.7-.6 1.2-.6z"/>
      </svg>
    </button>
    <div id="customize-panel" role="dialog" aria-label="Wallpaper" hidden>
      <h2>Wallpaper</h2>
      <div id="wallpapers" role="radiogroup" aria-label="Wallpaper"></div>
      <input id="wallpaper-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
    </div>
  </div>
</body>
</html>
