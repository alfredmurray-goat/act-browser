<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; img-src chrome: https: data: page-icon: moz-icon:; style-src chrome: 'unsafe-inline'">
  <title>New Tab</title>
  <link rel="icon" href="chrome://act/content/icons/act.svg">
  <link rel="stylesheet" href="chrome://act/content/shared/act.css">
  <link rel="stylesheet" href="chrome://act/content/newtab/newtab.css">
  <script type="module" src="chrome://act/content/newtab/newtab.mjs"></script>
</head>
<body>
  <main>
    <div id="hero">
      <img class="logo" src="chrome://act/content/icons/act.svg" alt="">
      <h1 id="greeting"></h1>
    </div>

    <form id="search">
      <input id="query" type="search" autocomplete="off" spellcheck="false">
      <button type="submit" id="actuent-search" title="Search Actuent (Enter)">Actuent</button>
      <button type="button" id="web-search" title="Search the web (Shift+Enter)"></button>
    </form>
    <div id="status" class="status"></div>
    <div id="results"></div>

    <nav id="top-sites" aria-label="Top sites"></nav>
  </main>
  <footer id="credit" hidden>Live results from <a href="https://actuent.ai">Actuent</a></footer>
</body>
</html>
