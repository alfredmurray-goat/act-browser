// Act Browser bootstrap (Firefox always skips the first line of this file).
//
// This runs very early with chrome privileges. All it does is register our
// chrome package and hand over to ActStartup, everything else lives in act/.
try {
  let actManifest = Components.classes["@mozilla.org/file/directory_service;1"]
    .getService(Components.interfaces.nsIProperties)
    .get("GreD", Components.interfaces.nsIFile);
  actManifest.append("act");
  actManifest.append("chrome.manifest");

  if (actManifest.exists()) {
    Components.manager
      .QueryInterface(Components.interfaces.nsIComponentRegistrar)
      .autoRegister(actManifest);
    ChromeUtils.importESModule("resource://act/ActStartup.sys.mjs").ActStartup.init();
  }
} catch (e) {
  Components.utils.reportError(e);
}
